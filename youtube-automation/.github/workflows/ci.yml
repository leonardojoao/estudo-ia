# =============================================================================
# CI — YouTube Automation
# GitHub Actions Pipeline
#
# Triggers:
#   - Push em qualquer branch
#   - Pull Request para main (bloqueia o merge se qualquer job falhar)
#
# Jobs e dependências:
#   lint-backend  ──┐
#                   ├── test-backend  ── build-backend ── security-scan
#   lint-frontend ──┘
#                   └── test-frontend ── build-frontend
# =============================================================================

name: CI — YouTube Automation

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

# Cancela runs em andamento ao receber novo push na mesma branch
# Economiza créditos de CI em PRs com múltiplos commits rápidos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# JOBS
# =============================================================================
jobs:

  # ===========================================================================
  # LINT BACKEND — ruff (análise estática + segurança) + black (formatação)
  # ===========================================================================
  lint-backend:
    name: "🔍 Lint Backend (ruff + black)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar ferramentas de lint
        run: pip install ruff==0.4.4 black==24.4.2

      - name: ruff — análise estática e regras de segurança
        run: ruff check . --output-format=github

      - name: black — verificação de formatação
        run: black --check --diff .

  # ===========================================================================
  # LINT FRONTEND — eslint (análise estática) + prettier (formatação)
  # ===========================================================================
  lint-frontend:
    name: "🔍 Lint Frontend (eslint + prettier)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: eslint — análise estática Vue/TypeScript
        run: npm run lint

      - name: prettier — verificação de formatação
        run: npm run format:check

  # ===========================================================================
  # TESTES BACKEND — pytest com cobertura mínima de 70%
  # Executado após lint para não desperdiçar minutos de CI com código inválido
  # ===========================================================================
  test-backend:
    name: "🧪 Testes Backend (pytest ≥70%)"
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar FFmpeg (necessário para testes de vídeo)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Instalar dependências da aplicação
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar dependências de teste
        run: |
          pip install \
            pytest==8.2.0 \
            pytest-cov==5.0.0 \
            pytest-asyncio==0.23.6 \
            httpx==0.27.0

      - name: Criar diretórios necessários para testes
        run: mkdir -p /tmp/test-videos /tmp/test-output /tmp/test-credentials

      - name: Executar testes com relatório de cobertura
        run: |
          pytest tests/ \
            --verbose \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --tb=short \
            -x
        env:
          # Variáveis de ambiente para modo de teste
          ENVIRONMENT: testing
          TESTING: "true"
          DATABASE_PATH: /tmp/test_youtube_automation.db
          VIDEOS_FOLDER: /tmp/test-videos
          OAUTH_CREDENTIALS_PATH: /tmp/test-credentials
          SECRET_KEY: test-secret-key-for-ci-only-not-for-production
          OLLAMA_URL: http://localhost:11434
          LOG_LEVEL: WARNING

      - name: Upload relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # ===========================================================================
  # TESTES FRONTEND — vitest com cobertura
  # ===========================================================================
  test-frontend:
    name: "🧪 Testes Frontend (vitest)"
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm run test:run -- --coverage

      - name: Upload relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 7

  # ===========================================================================
  # BUILD BACKEND — valida o Dockerfile de produção
  # Produz artefato de imagem para uso no security-scan
  # ===========================================================================
  build-backend:
    name: "🐳 Build Docker Backend"
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem backend (runtime stage, sem push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: false
          tags: youtube-automation-backend:ci-${{ github.sha }}
          # Cache de camadas entre runs (GitHub Actions Cache)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Carrega a imagem localmente para uso no security-scan
          load: true

      - name: Exportar imagem como artefato
        run: |
          docker save youtube-automation-backend:ci-${{ github.sha }} \
            | gzip > /tmp/backend-image.tar.gz

      - name: Upload artefato da imagem
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: /tmp/backend-image.tar.gz
          # Imagem grande — mantém apenas 1 dia (suficiente para o security-scan)
          retention-days: 1

  # ===========================================================================
  # BUILD FRONTEND — valida o Vite build de produção
  # ===========================================================================
  build-frontend:
    name: "🏗️ Build Frontend (Vite)"
    runs-on: ubuntu-latest
    needs: test-frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build
        env:
          # API URL em produção — relativo (proxy via Nginx)
          VITE_API_URL: /api

      - name: Upload artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ===========================================================================
  # SECURITY SCAN — Trivy
  # Executa após build para ter a imagem disponível
  # ===========================================================================
  security-scan:
    name: "🔒 Scan de Segurança (Trivy)"
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download da imagem backend
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image
          path: /tmp

      - name: Carregar imagem Docker
        run: docker load < /tmp/backend-image.tar.gz

      - name: "Trivy — vulnerabilidades na imagem Docker (OS + pacotes)"
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: youtube-automation-backend:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          # Ignora CVEs sem fix disponível — não há o que fazer por ora
          ignore-unfixed: true
          vuln-type: os,library
          # Bloqueia apenas CRITICAL e HIGH (produção não pode ter esses)
          severity: CRITICAL,HIGH
        # continue-on-error: true  # Descomente se quiser relatório sem bloquear o pipeline

      - name: "Trivy — scan do repositório (secrets + IaC)"
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          # Não bloqueia — apenas informa problemas no código-fonte
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM
