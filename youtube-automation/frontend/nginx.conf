# =============================================================================
# Nginx — YouTube Automation Frontend
#
# Responsabilidades:
#   1. Servir build estático do Vue 3 (SPA com Vue Router history mode)
#   2. Proxy reverso para API do FastAPI (/api → backend:8000)
#   3. Proxy SSE sem buffer (Server-Sent Events para status em tempo real)
#   4. Cache de assets estáticos gerados pelo Vite (nomes com hash)
#   5. Headers de segurança básicos
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Compressão Gzip — reduz tamanho de transferência dos assets
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Health check endpoint do frontend
    # Usado pelo HEALTHCHECK do Docker e pelo script healthcheck.py
    # -------------------------------------------------------------------------
    location = /health-frontend {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # SSE — Server-Sent Events (DEVE preceder /api/ para ter prioridade)
    #
    # Configurações críticas para streaming funcionar:
    #   - proxy_buffering off   → desabilita buffer (bytes chegam imediatamente)
    #   - proxy_cache off       → sem cache para conteúdo dinâmico
    #   - Connection ''         → mantém conexão keepalive para eventos
    #   - read_timeout 86400s   → conexão aberta por até 24h
    # -------------------------------------------------------------------------
    location /api/sse {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # -------------------------------------------------------------------------
    # Proxy para API do Backend — FastAPI em backend:8000
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        # Timeout estendido para uploads de vídeo e processamentos longos
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Buffers maiores para respostas grandes (payloads de vídeo)
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # -------------------------------------------------------------------------
    # Cache de Assets Estáticos — JS/CSS com hashes no nome (Vite)
    # Hashes garantem que nomes mudam quando o conteúdo muda → cache seguro
    # -------------------------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # SPA Fallback — Vue Router (history mode)
    #
    # try_files: tenta o arquivo exato → diretório → index.html
    # O index.html carrega o Vue que controla o roteamento client-side
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        # Headers de segurança básicos
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # -------------------------------------------------------------------------
    # Bloqueia arquivos sensíveis
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|gitignore|dockerignore|json)$ {
        # Permite package.json e similares como parte do bundle Vite
        # Bloqueia apenas arquivos de config na raiz
        location = /.env          { deny all; }
        location = /.env.local    { deny all; }
        location = /.env.example  { deny all; }
    }
}
